website:
  title: "Research & Evidence-Based Medicine"
  description: "A living course notebook for the University of Edinburgh MBChB REBM course."
  site-url: "https://ddi-talent.github.io/research-and-evidence-based-medicine/"
  favicon: assets/rebm-mark.svg
  page-navigation: true
  back-to-top-navigation: true
  repo-url: "https://github.com/DDI-Talent/research-and-evidence-based-medicine"
  repo-actions: [edit, issue]
  navbar:
    logo: assets/edinburgh-medical-school-white.png
    logo-alt: "The University of Edinburgh, Edinburgh Medical School"
    background: "#041e42"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Home
      - href: course-guide.qmd
        text: Course guide
      - href: S1_T01_DescribingData/index.qmd
        text: Topics
      - href: resources.qmd
        text: Resources
      - href: R_Toolkit/index.qmd
        text: R Toolkit
    right:
      - icon: github
        href: "https://github.com/DDI-Talent/research-and-evidence-based-medicine"
        aria-label: GitHub repository
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Course home
      - href: course-guide.qmd
        text: How to use this site
      - section: "Semester 1 · How do we analyse data?"
        contents:
          - href: S1_T01_DescribingData/index.qmd
            text: "01 · Describing data"
          - href: S1_T02_SignalVsNoise/index.qmd
            text: "02 · Signal vs the noise"
          - href: S1_T03_ComparingGroups/index.qmd
            text: "03 · Comparing groups"
          - href: S1_T04_CorrelationCausation/index.qmd
            text: "04 · Correlation and causation"
          - href: S1_T05_MeasureRisk/index.qmd
            text: "05 · Measuring risk"
          - href: S1_T06_Regression/index.qmd
            text: "06 · Regression for fair comparison"
          - href: S1_T07_EstimationPrediction/index.qmd
            text: "07 · Estimation vs prediction"
          - href: S1_T08_ClinicalDecisionMaking/index.qmd
            text: "08 · Clinical decision making"
      - section: "Semester 2 · How do we trust evidence?"
        contents:
          - href: S2_T09_AskingClinicalQuestions/index.qmd
            text: "09 · Asking clinical questions"
          - href: S2_T10_FindingEvidence/index.qmd
            text: "10 · Finding the right evidence"
          - href: S2_T11_StrengthOfEvidence/index.qmd
            text: "11 · The strength of evidence"
          - href: S2_T12_DistortedEvidence/index.qmd
            text: "12 · How evidence gets distorted"
          - href: S2_T13_BeingMisled/index.qmd
            text: "13 · Are we being misled?"
          - href: S2_T14_SystematicJudgement/index.qmd
            text: "14 · Systematic judgement"
          - href: S2_T15_ResultsMeaning/index.qmd
            text: "15 · What do the results mean?"
          - href: S2_T16_UsingEvidence/index.qmd
            text: "16 · How do I use evidence?"
      - section: "R Toolkit · Cross-semester reference"
        contents:
          - href: R_Toolkit/index.qmd
            text: "R Toolkit home"
          - href: R_Toolkit/cheat-sheet.qmd
            text: "Complete cheat sheet"
          - href: R_Toolkit/reading-code.qmd
            text: "Reading R code"
          - href: R_Toolkit/tidyverse.qmd
            text: "Tidyverse verbs"
          - href: R_Toolkit/missing-data.qmd
            text: "Missing data"
          - href: R_Toolkit/visualisation.qmd
            text: "Visualisation cookbook"
          - href: R_Toolkit/analyses.qmd
            text: "Analysis cookbook"
          - href: R_Toolkit/objects.qmd
            text: "Objects and models"
          - href: R_Toolkit/debugging.qmd
            text: "Debugging R"
          - href: R_Toolkit/reproducibility.qmd
            text: "Reproducibility"
          - href: R_Toolkit/reporting.qmd
            text: "Writing results"
          - href: R_Toolkit/sandbox.qmd
            text: "Practice sandbox"
      - href: resources.qmd
        text: Resources
  page-footer:
    left: "The University of Edinburgh · Edinburgh Medical School"
    right: "A living course notebook built with Quarto"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    anchor-sections: true

execute:
  freeze: auto
  warning: false
  message: false
